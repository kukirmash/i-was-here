<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="I Was Here — срез агата, построенный по времени регистрации.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>I Was Here</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Старый service worker мог закэшировать прежнюю сборку: снимаем его
       при каждом запуске, чтобы новая версия подхватывалась сразу. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
