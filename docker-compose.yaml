services:
  iwh-postgres:
    image: postgres:18.6-bookworm
    container_name: iwh-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql:Z
    restart: always

  iwh-postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations:Z

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: iwh-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:iwh-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  iwh-web:
    build: ./client
    container_name: iwh-web
    ports:
      - "127.0.0.1:8081:80"
    environment:
      # API запускается на хосте (`make iwh-run`), поэтому nginx ходит наружу.
      - API_UPSTREAM=${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
